      <p>${DB.analistas.length} cadastrados · dados impressos no rodapé do PDF</p></div>
      <button class="btn pri sm" id="nAn">${ico('plus')}Novo consultor</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Telefone</th><th>WhatsApp</th>
      <th>E-mail</th><th class="num">Clientes</th><th style="width:40px"></th></tr></thead>
      <tbody>${DB.analistas.map(a=>`<tr data-id="${a.id}" style="cursor:pointer">
        <td><div class="row" style="gap:9px"><span class="av" style="width:26px;height:26px;flex:0 0 26px;font-size:10px">${initials(a.nome)}</span>
          <b>${esc(a.nome)}</b></div></td>
        <td class="tiny">${esc(a.telefone||'—')}</td><td class="tiny">${esc(a.whatsapp||'—')}</td>
        <td class="tiny">${esc(a.email||'—')}</td>
        <td class="num">${DB.clientes.filter(x=>x.analista_id===a.id).length}</td>
        <td><button class="icobtn" data-m="${a.id}" style="border:0;width:28px;height:28px">${ico('dots')}</button></td></tr>`).join('')}
      </tbody></table></div></div>`;
    $('#nAn').onclick=()=>anForm(null);
    $$('#cfgBody tr[data-id]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('button'))return;anForm(analista(tr.dataset.id))});
    $$('#cfgBody [data-m]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=analista(b.dataset.m);
      popMenu(b,[{k:'e',label:'Editar',icon:'edit',fn:()=>anForm(a)},
        '-',{k:'d',label:'Excluir',icon:'trash',danger:true,fn:async()=>{
          if(DB.clientes.some(x=>x.analista_id===a.id)){toast('Consultor vinculado a clientes','err');return}
          if(await confirmar('Excluir consultor','Excluir '+esc(a.nome)+'?','Excluir')){
            DB.analistas=DB.analistas.filter(x=>x.id!==a.id);save('meta');vCfg()}}}]);
    });
    return;
  }
  if(cfgTab==='seg'){
    const PERFIS=[['Administrador','Acesso total: cadastros, configurações, todos os orçamentos e exclusões.','shield'],
      ['Gestor','Dashboard consolidado e orçamentos de toda a equipe; sem alterar configurações do sistema.','chart'],
      ['Analista','Cria e gerencia os próprios orçamentos e os clientes autorizados.','users']];
    body.innerHTML=`<div class="card"><div class="card-h"><div><h3>Perfis de acesso</h3>
      <p>Estrutura pronta para autenticação — hoje o sistema roda em sessão única local</p></div></div>
      <div class="card-b grid" style="gap:12px">
        ${PERFIS.map(([n,d,i])=>`<div class="row" style="gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;align-items:flex-start">
          <span style="color:var(--ag);display:flex;margin-top:2px">${ico(i)}</span>
          <div style="flex:1"><b style="font-size:13.5px">${n}</b><div class="tiny muted">${d}</div></div>
          ${c.perfil===n?'<span class="pill s-aprovado"><i></i>Perfil atual</span>':`<button class="btn sm" data-p="${n}">Assumir</button>`}
        </div>`).join('')}
        <div class="row" style="gap:8px;padding:12px;background:var(--ag-50);border-radius:10px">
          <span style="color:var(--ag);display:flex">${ico('shield')}</span>
          <span class="tiny">Ao publicar com Supabase Auth, cada usuário recebe nome, e-mail, perfil e permissões,
          e as políticas de RLS aplicam o recorte por analista automaticamente.</span></div>
      </div></div>`;
    $$('[data-p]').forEach(b=>b.onclick=()=>{c.perfil=b.dataset.p;save('meta');shell();vCfg();toast('Perfil: '+b.dataset.p)});
    return;
  }
  if(cfgTab==='dados'){
    const size=v=>{const s=JSON.stringify(v).length;return s>1e6?(s/1e6).toFixed(1)+' MB':(s/1024).toFixed(0)+' KB'};
    body.innerHTML=`<div class="grid g2" style="align-items:start">
      <div class="card"><div class="card-h"><div><h3>Armazenamento</h3>
        <p>${Store.ok?'Persistência ativa — os dados voltam ao reabrir':'Sessão temporária — exporte o backup antes de fechar'}</p></div></div>
        <div class="card-b grid" style="gap:10px">
          ${[['Clientes',DB.clientes.length,DB.clientes],['Unidades',DB.unidades.length,DB.unidades],
             ['Empresas',DB.empresas.length,DB.empresas],
             ['Consultores',DB.analistas.length,DB.analistas],['Produtos',DB.produtos.length,DB.produtos],
             ['Orçamentos',DB.orcamentos.length,DB.orcamentos]].map(([n,q,v])=>
            `<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-2)">
              <span>${n}</span><span class="muted tiny">${q.toLocaleString('pt-BR')} registros · ${size(v)}</span></div>`).join('')}
          <div class="row" style="gap:8px;margin-top:6px">
            <span style="color:${Store.ok?'var(--ok)':'var(--warn)'};display:flex">${ico(Store.ok?'chk':'alert')}</span>
            <span class="tiny">${Store.ok?'window.storage disponível: cada alteração é gravada automaticamente.'
              :'Armazenamento persistente indisponível neste ambiente. Use Exportar backup para não perder os dados.'}</span></div>
        </div></div>
      <div class="card"><div class="card-h"><div><h3>Backup</h3><p>Arquivo JSON com todo o conteúdo do sistema</p></div></div>
        <div class="card-b grid" style="gap:10px">
          <button class="btn block" id="bExp">${ico('dl')}Exportar backup completo</button>
          <button class="btn block" id="bImp">${ico('up')}Restaurar backup</button>
          <button class="btn block" id="bCsv">${ico('dl')}Exportar orçamentos em CSV</button>
          <hr style="border:0;border-top:1px solid var(--line-2);margin:6px 0">
          <button class="btn dang block" id="bWipe">${ico('trash')}Apagar todos os orçamentos</button>
        </div></div></div>`;
    $('#bExp').onclick=()=>dl(new Blob([JSON.stringify({v:1,exportado:new Date().toISOString(),...DB},null,1)],
      {type:'application/json'}),'backup_orcamentos_autoglass_'+today()+'.json');
    $('#bImp').onclick=()=>{
      const i=document.createElement('input');i.type='file';i.accept='.json';
      i.onchange=()=>{const f=i.files[0];if(!f)return;const fr=new FileReader();
        fr.onload=async()=>{try{const j=JSON.parse(String(fr.result));
          if(!j.clientes)throw new Error('formato inválido');
          if(!await confirmar('Restaurar backup','Isso substitui todos os dados atuais do sistema.','Restaurar',false))return;
          DB.config={...DEFCFG,...j.config};DB.clientes=j.clientes||[];DB.unidades=j.unidades||[];
          DB.analistas=j.analistas||[];DB.produtos=j.produtos||[];DB.orcamentos=j.orcamentos||[];
          DB.empresas=j.empresas&&j.empresas.length?j.empresas:clone(SEED_EMPRESAS);
          save('meta');save('prod');save('orc');shell();toast('Backup restaurado');vCfg();
        }catch(e){toast('Falha: '+e.message,'err')}};fr.readAsText(f)};i.click();
    };
    $('#bCsv').onclick=()=>{
      const H=['Numero','Versao','Data','Cliente','CNPJ','Identificacao','Tipo','Veiculo','Unidade','TipoServico',
        'Consultor','Itens','Subtotal','Instalacao','Total','Status','Validade','Vencimento'];
      const rows=DB.orcamentos.map(o=>{const c=cliente(o.cliente_id)||{},u=unidade(o.unidade_id)||{};
        return [o.numero,o.versao,dBR(o.data),c.nome_fantasia||c.razao_social||'',c.cnpj||'',o.ident_valor,o.ident_tipo,
          o.veiculo||'',u.codigo||'',o.tipo_servico,analista(o.analista_id)?.nome||'',o.itens.length,
          o.subtotal.toFixed(2).replace('.',','),o.instalacao.toFixed(2).replace('.',','),
          o.total.toFixed(2).replace('.',','),o.status,o.validade_dias,dBR(vencimento(o))]});
      const csv='\uFEFF'+[H,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
      dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'orcamentos_'+today()+'.csv');
    };
    $('#bWipe').onclick=async()=>{
      if(await confirmar('Apagar orçamentos','Todos os '+DB.orcamentos.length+' orçamentos serão removidos. Cadastros são mantidos.','Apagar tudo')){
        DB.orcamentos=[];save('orc');toast('Orçamentos apagados');vCfg()}};
    return;
  }
  /* salvar (abas de formulário) */
  const g=id=>$('#'+id)?.value.trim();
  $('#cUp')&&($('#cUp').onclick=()=>pickImage(u=>{c.logo=u;save('meta');shell();vCfg();toast('Logo atualizada')},600));
  $('#cQr')&&($('#cQr').onchange=e=>$('#lQr').classList.toggle('on',e.target.checked));
  $('#cSave')&&($('#cSave').onclick=()=>{
    if(cfgTab==='geral')Object.assign(c,{empresa:g('cEmp'),usuario:g('cUsr'),tema:$('#cTema').value,prefixo:(g('cPref')||'ORC').toUpperCase(),
      proxNumero:Math.max(1,parseInt(g('cProx'))||1),validade:Math.max(1,parseInt(g('cVal'))||5),
      urlPublica:g('cUrl'),qrcode:$('#cQr').checked});
    if(cfgTab==='pdf')Object.assign(c,{chassiPadrao:num(g('cCh')),colaPadrao:num(g('cCo')),
      txtChassiCola:g('tChCo'),txtChassi:g('tCh'),txtCola:g('tCo'),msgRodape:g('cRod')});
    if(cfgTab==='mail')Object.assign(c,{mailRemetente:g('mRem'),mailNome:g('mNom'),mailAssunto:g('mAss'),
      mailCorpo:$('#mCor').value,mailApi:g('mApi')});
    if(cfgTab==='integ')Object.assign(c,{placaApi:g('pApi'),placaToken:g('pTok')});
    save('meta');shell();applyTheme();toast('Configurações salvas');vCfg();
  });
}
function anForm(a){
  const n=!a;a=a?{...a}:{id:uid(),nome:'',telefone:'',whatsapp:'',email:'',ativo:true};
  modal({title:n?'Novo consultor':'Editar consultor',sub:'Dados impressos no rodapé do orçamento',
    body:`<div class="grid" style="gap:14px">
      ${`<label class="f"><span>Nome <i>*</i></span><input class="inp" id="aN" value="${esc(a.nome)}"></label>`}
      <div class="grid g2" style="gap:12px">
        <label class="f"><span>Telefone</span><input class="inp" id="aT" value="${esc(a.telefone)}"></label>
        <label class="f"><span>WhatsApp</span><input class="inp" id="aW" value="${esc(a.whatsapp)}"></label>
      </div>
      <label class="f"><span>E-mail comercial</span><input class="inp" id="aE" value="${esc(a.email)}"></label></div>`,
    footer:`<button class="btn" data-close>Cancelar</button><button class="btn pri" id="aOk">${ico('save')}Salvar</button>`,
    onMount(ov,close){
      mask(ov.querySelector('#aT'),mkTel);mask(ov.querySelector('#aW'),mkTel);
      ov.querySelector('#aOk').onclick=()=>{
        const v=id=>ov.querySelector('#'+id).value.trim();
        if(!v('aN')){toast('Informe o nome','err');return}
        Object.assign(a,{nome:v('aN'),telefone:v('aT'),whatsapp:v('aW'),email:v('aE')});
        const i=DB.analistas.findIndex(x=>x.id===a.id);i<0?DB.analistas.push(a):DB.analistas[i]=a;
        save('meta');close();toast('Consultor salvo');vCfg();
      };
    }});
}
/* ═══════════════════ INIT ═══════════════════ */
function shell(){
  $('#sbLogo').src=DB.config.logo||LOGO_AG;
  $('#uname').textContent=DB.config.usuario;
  $('#urole').textContent=DB.config.perfil;
  $('#uav').textContent=initials(DB.config.usuario);
  $('#homeBtn').innerHTML=ico('home');
  applyTheme();
}
$('#sbHome').onclick=()=>go('hub');
$('#homeBtn').onclick=()=>go('hub');
$('#themeBtn').onclick=()=>{
  const atual=document.documentElement.dataset.theme==='dark';
  DB.config.tema=atual?'claro':'escuro';save('meta');applyTheme();
  if(ROUTE.k==='cfg')vCfg();
};
$('#toggleSb').onclick=()=>{
  if(innerWidth<=900)document.body.classList.toggle('drawer-open');
  else document.body.classList.toggle('mini');
};
addEventListener('click',e=>{if(document.body.classList.contains('drawer-open')&&!e.target.closest('.sb,#toggleSb'))
  document.body.classList.remove('drawer-open')});
(async()=>{
  renderNav();
  await boot();
  shell();
  if(!location.hash)location.hash='#/hub';
  router();
})();
</script>
