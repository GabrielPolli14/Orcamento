<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autoglass · Orçamentos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23164194'/%3E%3Cpath d='M14 42c3.6-13.4 8-20.6 18-20.6S46.4 28.6 50 42z' fill='%23fff' opacity='.16'/%3E%3Cpath d='M27.5 44 36 20h5.4l-2.2 6.2h-6.4l-1.6 4.6h6.4L35.4 37h-6.5l-2.5 7z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#164194">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ag:#164194; --ag-700:#12356f; --ag-600:#1a4bab; --ag-300:#7f9ad4; --ag-50:#eef2fb;
  --ink:#131a2b; --ink-2:#3f4a63; --ink-3:#6b7690; --ink-4:#9aa3b8;
  --line:#e4e8f1; --line-2:#eef1f7; --bg:#f4f6fb; --card:#fff;
  --ok:#0f7b4f; --ok-bg:#e6f4ee; --warn:#a86a00; --warn-bg:#fdf3e2;
  --dang:#bb2d2d; --dang-bg:#fbeceb; --purple:#5b48c8; --purple-bg:#eeebfb;
  --grey:#5c6478; --grey-bg:#eceef4;
  --surface-2:#fbfcfe; --hover:#f7f9fd; --line-h:#cfd7e8; --scroll:#cdd4e3;
  --warn-soft:#fffdf7; --warn-line:#f2ddb4; --code-bg:#f4f6fb; --chart-bar:#dbe4f7;
  --mark:#fff3bf; --sw-off:#d3daea; --dang-line:#f0cdcb;
  --tip-bg:#131a2b; --tip-fg:#fff; --focus:var(--focus); --top-bg:rgba(255,255,255,.86);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh:0 1px 2px rgba(19,26,43,.05),0 1px 3px rgba(19,26,43,.04);
  --sh-2:0 4px 16px rgba(19,26,43,.07),0 1px 3px rgba(19,26,43,.04);
  --sh-3:0 18px 50px rgba(19,26,43,.16);
  --sb:252px; --sb-min:74px;
  --ff:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ag);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px;border:3px solid var(--bg)}
:focus-visible{outline:2px solid var(--ag-600);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:0 0 var(--sb);background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;transition:width .18s ease,flex-basis .18s ease;z-index:40}
body.mini .sb{width:var(--sb-min);flex-basis:var(--sb-min)}
.sb-top{padding:14px 18px 12px;display:flex;align-items:center;gap:10px;min-height:64px;
  background:none;border:0;width:100%;cursor:pointer;border-radius:0}
.sb-top:hover .sb-logo{opacity:.75}
.sb-logo{transition:opacity .12s}
.sb-logo{height:30px;width:auto;max-width:100%;object-fit:contain;display:block}
body.mini .sb-logo{height:24px}
.sb-nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.sb-sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);
  padding:16px 12px 6px;font-weight:600}
body.mini .sb-sec{opacity:0;height:14px;padding:8px 0 0}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);
  color:var(--ink-2);font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left;
  position:relative;transition:background .12s,color .12s}
.nav:hover{background:var(--ag-50);color:var(--ag)}
.nav.on{background:var(--ag);color:#fff}
.nav svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.7}
.nav span{white-space:nowrap;overflow:hidden}
body.mini .nav span{display:none}
body.mini .nav{justify-content:center;padding:11px 0}
body.mini .nav:hover span,body.mini .nav.on span{display:none}
body.mini .nav[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);
  background:var(--tip-bg);color:var(--tip-fg);padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;z-index:80}
.sb-foot{padding:12px;border-top:1px solid var(--line-2)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm)}
.av{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--ag);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:12px}
.sb-user div{overflow:hidden}
.sb-user b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sb-user small{color:var(--ink-3);font-size:11px}
body.mini .sb-user div{display:none}
body.mini .sb-user{justify-content:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:0 0 34px}
.icobtn:hover{background:var(--ag-50);color:var(--ag);border-color:var(--ag-300)}
.icobtn svg{width:17px;height:17px;stroke-width:1.8}
.top h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:12.5px;font-weight:400}
.spacer{flex:1}
.wrap{padding:26px 22px 64px;max-width:1320px;width:100%;margin:0 auto}

/* ---------- COMPONENTES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;
  font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--hover);border-color:var(--line-h)}
.btn svg{width:16px;height:16px;stroke-width:1.9}
.btn.pri{background:var(--ag);border-color:var(--ag);color:#fff;box-shadow:0 1px 2px rgba(22,65,148,.25)}
.btn.pri:hover{background:var(--ag-600);border-color:var(--ag-600)}
.btn.dang{color:var(--dang);border-color:var(--dang-line)}
.btn.dang:hover{background:var(--dang-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ag-50);color:var(--ag)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn.lg{height:44px;padding:0 22px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h p{font-size:12.5px;color:var(--ink-3)}
.card-b{padding:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

label.f{display:block}
label.f>span{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
label.f>span i{color:var(--dang);font-style:normal}
.inp,select.inp,textarea.inp{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card);transition:border-color .12s,box-shadow .12s;font-size:13.5px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:84px;line-height:1.55}
.inp:hover{border-color:var(--line-h)}
.inp:focus{outline:0;border-color:var(--ag-600);box-shadow:0 0 0 3px var(--focus)}
.inp::placeholder{color:var(--ink-4)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%236b7690' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}
.inp.money{text-align:right;font-weight:500}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.err{border-color:var(--dang)!important;box-shadow:0 0 0 3px rgba(187,45,45,.1)!important}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.s-rascunho{background:var(--warn-bg);color:var(--warn)}
.s-gerado{background:var(--ag-50);color:var(--ag)}
.s-enviado{background:var(--purple-bg);color:var(--purple)}
.s-aprovado{background:var(--ok-bg);color:var(--ok)}
.s-recusado{background:var(--dang-bg);color:var(--dang)}
.s-cancelado{background:var(--grey-bg);color:var(--grey)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--ag-50);color:var(--ag-700);
  font-size:11px;font-weight:600}

.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:11px 14px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-weight:500;white-space:nowrap}
.tbl .ck{width:38px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strong{font-weight:600}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ag);cursor:pointer}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lb{font-size:12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .lb svg{width:14px;height:14px;color:var(--ag-300);stroke-width:2}
.kpi .vl{font-size:25px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.kpi .dt{font-size:11.5px;color:var(--ink-3)}
.kpi.hl{background:linear-gradient(174deg,var(--ag) 0%,var(--ag-700) 100%);border-color:var(--ag-700)}
.kpi.hl .lb,.kpi.hl .dt{color:rgba(255,255,255,.72)}
.kpi.hl .lb svg{color:rgba(255,255,255,.6)}
.kpi.hl .vl{color:#fff}

.empty{text-align:center;padding:56px 24px;color:var(--ink-3)}
.empty svg{width:34px;height:34px;color:var(--ink-4);stroke-width:1.5;margin-bottom:12px}
.empty h4{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:5px}
.empty p{max-width:340px;margin:0 auto 16px}

/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(19,26,43,.42);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:20px;animation:fade .14s ease}
@keyframes fade{from{opacity:0}}
.md{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-3);width:100%;max-width:560px;
  max-height:90vh;display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}}
.md.wide{max-width:920px}
.md.xl{max-width:1080px}
.md-h{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.md-h h3{font-size:16px;font-weight:600;flex:1}
.md-h p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.md-b{padding:22px;overflow-y:auto;flex:1}
.md-f{padding:15px 22px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;
  background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.dr{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:640px;background:var(--card);z-index:100;
  box-shadow:var(--sh-3);display:flex;flex-direction:column;animation:slide .2s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}

.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px;
  align-items:flex-end;pointer-events:none}
.toast{background:var(--tip-bg);color:var(--tip-fg);padding:11px 16px;border-radius:11px;font-size:13px;font-weight:500;
  box-shadow:var(--sh-3);display:flex;align-items:center;gap:9px;animation:tin .2s ease;max-width:380px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.toast svg{width:16px;height:16px;flex:0 0 16px;stroke-width:2.2}
.toast.ok svg{color:#5ee0a0}.toast.err svg{color:#ff9c94}

/* autocomplete */
.ac{position:relative}
.ac-list{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh-2);max-height:298px;overflow-y:auto;z-index:60;padding:5px}
.ac-i{padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;gap:11px;align-items:center}
.ac-i:hover,.ac-i.sel{background:var(--ag-50)}
.ac-i b{font-weight:600;font-size:13px}
.ac-i .c{font-size:11px;color:var(--ag);font-weight:600;background:var(--ag-50);padding:2px 7px;border-radius:5px;flex:0 0 auto}
.ac-i .d{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ac-i .v{font-size:12.5px;font-weight:600;color:var(--ink);flex:0 0 auto}
.ac-i mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.ac-empty{padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* seleção visual (radio cards) */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:13px;cursor:pointer;background:var(--card);
  display:flex;flex-direction:column;gap:6px;transition:border-color .12s,background .12s;text-align:left}
.opt:hover{border-color:var(--ag-300);background:var(--surface-2)}
.opt.on{border-color:var(--ag);background:var(--ag-50)}
.opt svg{width:19px;height:19px;color:var(--ink-3);stroke-width:1.8}
.opt.on svg{color:var(--ag)}
.opt b{font-size:13px;font-weight:600}
.opt small{font-size:11.5px;color:var(--ink-3);line-height:1.35}

.chk{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);
  border-radius:var(--r-sm);cursor:pointer;background:var(--card)}
.chk.on{border-color:var(--ag);background:var(--ag-50)}
.chk input{margin-top:2px}
.chk b{font-size:13px;font-weight:600;display:block}
.chk small{font-size:11.5px;color:var(--ink-3)}

/* builder */
.bld{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:20px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.step-h{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-2)}
.step-n{width:25px;height:25px;flex:0 0 25px;border-radius:8px;background:var(--ag-50);color:var(--ag);
  display:grid;place-items:center;font-size:12px;font-weight:600}
.step-n.done{background:var(--ok-bg);color:var(--ok)}
.step-h h3{font-size:14px;font-weight:600;flex:1}
.step-b{padding:20px}
.tot-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-2)}
.tot-line.big{border-top:1px solid var(--line);margin-top:9px;padding-top:13px;font-size:15px;font-weight:600;color:var(--ink)}
.tot-line.big b{font-size:21px;color:var(--ag);letter-spacing:-.02em}

.logo-box{width:100%;height:104px;border:1.5px dashed var(--line);border-radius:var(--r-sm);display:grid;
  place-items:center;background:var(--surface-2);cursor:pointer;overflow:hidden;padding:10px;position:relative}
.logo-box:hover{border-color:var(--ag-300);background:var(--ag-50)}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.logo-box .ph{text-align:center;color:var(--ink-3);font-size:12px}
.logo-box .ph svg{width:20px;height:20px;margin-bottom:5px;stroke-width:1.8}

/* charts */
.chart{width:100%;height:200px;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.bar-row{display:flex;align-items:center;gap:11px;padding:6px 0;font-size:12.5px}
.bar-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:0 0 96px;height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--ag);border-radius:99px}
.bar-row .vl{flex:0 0 auto;font-weight:600;width:34px;text-align:right}

.hist{display:flex;flex-direction:column;gap:0}
.hist-i{display:flex;gap:13px;padding-bottom:16px;position:relative}
.hist-i:not(:last-child)::before{content:'';position:absolute;left:8px;top:19px;bottom:0;width:1.5px;background:var(--line)}
.hist-d{width:17px;height:17px;flex:0 0 17px;border-radius:50%;background:var(--card);border:2.5px solid var(--ag-300);margin-top:2px;z-index:1}
.hist-i:first-child .hist-d{border-color:var(--ag);background:var(--ag-50)}
.hist-i b{font-size:13px;font-weight:600;display:block}
.hist-i small{font-size:11.5px;color:var(--ink-3)}

.menu{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);
  padding:5px;z-index:120;min-width:206px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border:0;background:none;
  border-radius:8px;cursor:pointer;font-size:13px;text-align:left;color:var(--ink-2)}
.menu button:hover{background:var(--ag-50);color:var(--ag)}
.menu button.d{color:var(--dang)}.menu button.d:hover{background:var(--dang-bg)}
.menu svg{width:15px;height:15px;stroke-width:1.9}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 0}

.bulk{position:sticky;bottom:14px;background:var(--tip-bg);color:var(--tip-fg);border-radius:var(--r);padding:11px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--sh-3);z-index:20;margin-top:14px;flex-wrap:wrap}
.bulk b{font-size:13.5px}
.bulk .btn{background:rgba(127,127,127,.16);border-color:rgba(127,127,127,.3);color:var(--tip-fg)}
.bulk .btn:hover{background:rgba(127,127,127,.32)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 15px;border:0;background:none;cursor:pointer;font-size:13.5px;font-weight:500;
  color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ag);border-bottom-color:var(--ag);font-weight:600}
.tab:hover{color:var(--ag)}

.prev{background:var(--card);padding:32px;border-radius:var(--r);border:1px solid var(--line)}
.prev-sec{margin-bottom:22px}
.prev-lb{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:7px}

.progress{height:3px;background:var(--line-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ag);transition:width .3s}
.sw{width:38px;height:22px;border-radius:99px;background:var(--sw-off);position:relative;cursor:pointer;
  flex:0 0 38px;transition:background .15s;border:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--card);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ag)}
.sw.on::after{transform:translateX(16px)}

.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  font-size:10.5px;font-weight:600;color:var(--ink-3);background:var(--surface-2);font-family:var(--ff)}


/* ───────── HUB ───────── */
.hub-hero{background:linear-gradient(150deg,var(--ag) 0%,var(--ag-700) 100%);border-radius:var(--r-lg);
  padding:30px 32px;color:#fff;display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:20px;
  box-shadow:0 10px 30px rgba(22,65,148,.18)}
[data-theme="dark"] .hub-hero{background:linear-gradient(150deg,#23406f 0%,#141f36 100%);box-shadow:var(--sh-2)}
.hub-hero h2{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.hub-hero p{color:rgba(255,255,255,.78);font-size:13.5px;margin-top:6px;max-width:46ch}
.hub-hero .btn{background:#fff;border-color:#fff;color:var(--ag);font-weight:600}
.hub-hero .btn:hover{background:#eef2fb}
.hub-stats{display:flex;gap:26px;flex-wrap:wrap}
.hub-stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.hub-stat span{font-size:11.5px;color:rgba(255,255,255,.72)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.hub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:7px;
  transition:border-color .13s,transform .13s,box-shadow .13s}
.hub-card:hover{border-color:var(--ag-300);transform:translateY(-2px);box-shadow:var(--sh-2)}
.hub-card .ic{width:36px;height:36px;border-radius:11px;background:var(--ag-50);color:var(--ag);
  display:grid;place-items:center;margin-bottom:5px}
.hub-card .ic svg{width:18px;height:18px;stroke-width:1.9}
.hub-card b{font-size:14px;font-weight:600}
.hub-card small{font-size:12px;color:var(--ink-3);line-height:1.45}
.hub-card .n{font-size:11.5px;color:var(--ag);font-weight:600;margin-top:2px}
@media(max-width:900px){.hub-hero{padding:22px}.hub-hero h2{font-size:21px}}

.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:14px}
.pay-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.pay-c header{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:11px}
.pay-c header svg{width:17px;height:17px;color:var(--ag);stroke-width:1.8;flex:0 0 17px;margin-top:2px}
.pay-c header b{font-size:13.5px;font-weight:600;line-height:1.35}
.pay-c header small{font-size:11.5px;color:var(--ink-3)}
.pay-r{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line-2)}
.pay-r span{font-size:11.5px;color:var(--ink-3);flex:0 0 96px}
.pay-r b{font-size:13px;font-weight:600;flex:1;word-break:break-all}
.pay-r button{opacity:0;transition:opacity .12s}
.pay-r:hover button,.pay-r:focus-within button{opacity:1}
.pay-c footer{padding:13px 18px;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.pay-r button{opacity:1}}

/* ───────── TEMA ESCURO ───────── */
[data-theme="dark"]{
  --ag:#5b93f2; --ag-700:#2c4f8f; --ag-600:#77a8f7; --ag-300:#3d5a8f; --ag-50:#1a2436;
  --ink:#e9edf5; --ink-2:#b7c0d2; --ink-3:#8a93a8; --ink-4:#69718a;
  --line:#2a3244; --line-2:#232a3a; --bg:#0f131b; --card:#171c27;
  --surface-2:#1c2230; --hover:#212837; --line-h:#3b4459; --scroll:#333c50;
  --warn-soft:#241f13; --warn-line:#4a3d1e; --code-bg:#1c2230; --chart-bar:#2b3a5a;
  --mark:#5c4a12; --sw-off:#3a4359; --dang-line:#5c3030;
  --ok:#4ec78f; --ok-bg:#12291f; --warn:#e0a94a; --warn-bg:#2b2312;
  --dang:#f0837a; --dang-bg:#2e1b1a; --purple:#a291f7; --purple-bg:#211d38;
  --grey:#9aa3b8; --grey-bg:#232935;
  --tip-bg:#2a3244; --tip-fg:#eef1f7; --focus:rgba(119,168,247,.22);
  --top-bg:rgba(23,28,39,.86);
  --sh:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --sh-2:0 4px 16px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --sh-3:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}
[data-theme="dark"] .nav.on,[data-theme="dark"] .btn.pri{color:#0d1118}
[data-theme="dark"] .av{color:#0d1118}
[data-theme="dark"] .kpi.hl{background:linear-gradient(174deg,#23406f 0%,#182a49 100%);border-color:#2c4f8f}
[data-theme="dark"] .kpi.hl .vl,[data-theme="dark"] .kpi.hl .lb,[data-theme="dark"] .kpi.hl .dt{color:#eef1f7}
[data-theme="dark"] .kpi.hl .lb,[data-theme="dark"] .kpi.hl .dt{opacity:.72}
/* logomarcas são arquivos com fundo branco: recebem um selo claro no tema escuro */
[data-theme="dark"] .sb-logo{background:#fff;border-radius:7px;padding:4px 7px}
[data-theme="dark"] .tbl img,[data-theme="dark"] .ac-i img,[data-theme="dark"] .logo-box img,
[data-theme="dark"] .card-b img,[data-theme="dark"] .step-b img{background:#fff;border-radius:5px;padding:3px}
[data-theme="dark"] input[type=date],[data-theme="dark"] input[type=time]{color-scheme:dark}

.mobile-only{display:none}
.mobile-hide{display:inline-grid}
@media(max-width:1180px){.bld{grid-template-columns:1fr}.side{position:static}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .sb{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;width:var(--sb);flex-basis:var(--sb)}
  body.drawer-open .sb{transform:none}
  body.drawer-open::after{content:'';position:fixed;inset:0;background:rgba(19,26,43,.4);z-index:35}
  body.mini .sb{width:var(--sb);flex-basis:var(--sb)}
  body.mini .nav span,body.mini .sb-sec,body.mini .sb-user div{display:block;opacity:1}
  body.mini .nav{justify-content:flex-start;padding:9px 12px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .wrap{padding:18px 14px 60px}
  .top{padding:0 14px}.top .sub{display:none}
  .mobile-only{display:inline-flex}
  .mobile-hide{display:none}
  .md-f{flex-direction:column-reverse}.md-f .btn{width:100%}
  .prev{padding:18px}
}
</style>

   Persistência real via window.storage (artifact storage).
   Fallback em memória + backup manual JSON caso indisponível.  */
const KEYS={meta:'ag:meta',orc:'ag:orcamentos',prod:'ag:produtos'};
const mem={};
const Store={
  get ok(){return typeof window.storage!=='undefined'&&!!window.storage&&typeof window.storage.set==='function'},
  async get(k){
    if(!this.ok)return mem[k]??null;
    try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null}catch(e){return null}
  },
  async set(k,v){
    mem[k]=v;
    if(!this.ok)return false;
    try{await window.storage.set(k,JSON.stringify(v));return true}catch(e){console.warn('storage',e);return false}
  }
};
let DB={config:null,analistas:[],clientes:[],unidades:[],empresas:[],produtos:[],orcamentos:[],seq:0};
const savers={};
function save(part){
  clearTimeout(savers[part]);
  savers[part]=setTimeout(()=>{
    if(part==='meta')Store.set(KEYS.meta,{config:DB.config,analistas:DB.analistas,clientes:DB.clientes,
      unidades:DB.unidades,empresas:DB.empresas,seq:DB.seq});
    if(part==='orc')Store.set(KEYS.orc,DB.orcamentos);
    if(part==='prod')Store.set(KEYS.prod,DB.produtos);
  },140);
}

async function boot(){
  const meta=await Store.get(KEYS.meta);
  const orc=await Store.get(KEYS.orc);
  const prod=await Store.get(KEYS.prod);
  if(meta){DB.config={...DEFCFG,...meta.config};DB.analistas=meta.analistas||[];DB.clientes=meta.clientes||[];
    DB.unidades=meta.unidades||[];DB.empresas=meta.empresas||[];DB.seq=meta.seq||0}
  else{seedMeta();save('meta')}
  DB.orcamentos=orc||[];
  DB.produtos=prod&&prod.length?prod:[];
  if(!DB.produtos.length){DB.produtos=await unpackProdutos();save('prod')}
  /* atualização da base embarcada: unidades completas + catálogo integral de peças */
  if(!DB.empresas||!DB.empresas.length)DB.empresas=clone(SEED_EMPRESAS);
  if((DB.config.seedVer||0)<SEEDVER){
    const antes=DB.config.seedVer||0;
    mergeUnidades();
    const add=await mergeProdutos();
    /* valores base de instalação: sobe para 16/53 sem sobrescrever ajustes manuais */
    if(antes<3){
      if(num(DB.config.chassiPadrao)===13)DB.config.chassiPadrao=16;
      if(num(DB.config.colaPadrao)===48)DB.config.colaPadrao=53;
      DB.clientes.forEach(c=>{if(num(c.chassi_valor)===13)c.chassi_valor=16;if(num(c.cola_valor)===48)c.cola_valor=53});
    }
    DB.config.seedVer=SEEDVER;save('meta');save('prod');
    if(add)setTimeout(()=>toast(add.toLocaleString('pt-BR')+' peças novas na base'),900);
  }
}
/* base de peças embarcada compactada (gzip + base64), expandida no navegador */
async function unpackProdutos(){
  try{
    if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream indisponível');
    const bin=Uint8Array.from(atob(SEED_PRODUTOS_GZ),ch=>ch.charCodeAt(0));
    const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return txt.trim().split('\n').map(l=>{const[c,d,g,v]=l.split('|');
      return{id:'p'+c,codigo:c,descricao:d,categoria:g,aplicacao:aplic(d),valor:parseFloat(v)||0,ativo:true}});
  }catch(e){console.warn('base de peças:',e.message);return[]}
}
function empresaDaRaiz(raiz){return SEED_EMPRESAS.find(e=>e.raiz===raiz)}
function unidadeFromSeed(s){
  const e=empresaDaRaiz(s.raiz);
  return{id:'u'+s.cod,codigo:s.cod,razao_social:e?e.razao_social:('AUTOGLASS '+s.cid.toUpperCase()),rs_auto:!e,
    cnpj:s.cnpj,endereco:s.end,bairro:s.bai||'',cidade:s.cid,estado:s.uf,cep:mkCEP(s.cep),
    telefone:s.tel,ramal:s.ram||'',email:'',ativo:true};
}

function empresaDaUnidade(u){

  return DB.empresas.find(e=>e.raiz===raiz)||null;

function dadosPagamentoTexto(e){
  if(!e)return '';
  return [`*${e.razao_social}*`,`CNPJ: ${e.cnpj}`,`Banco: ${e.banco}`,`Agência: ${e.agencia}`,
    `Conta corrente: ${e.conta}`,`Chave PIX: ${e.pix}`].join('\n');
}
function mergeUnidades(){
  const by={};DB.unidades.forEach(u=>by[u.codigo]=u);
  SEED_UNIDADES.forEach(s=>{
    const n=unidadeFromSeed(s),ex=by[s.cod];
    if(ex)Object.assign(ex,{cnpj:n.cnpj,endereco:n.endereco,bairro:n.bairro,cidade:n.cidade,estado:n.estado,
      cep:n.cep,telefone:n.telefone,ramal:n.ramal,
      razao_social:ex.rs_auto===false?ex.razao_social:n.razao_social,
      rs_auto:ex.rs_auto===false?false:n.rs_auto});
    else DB.unidades.push(n);
  });
}
async function mergeProdutos(){
  const novos=await unpackProdutos();
  if(!novos.length)return 0;
  const by={};DB.produtos.forEach(p=>by[p.codigo]=p);
  let add=0;
  novos.forEach(p=>{if(!by[p.codigo]){DB.produtos.push(p);add++}});
  return add;
}
const MARCAS=['VW','GM','CHEVROLET','FIAT','FORD','HYUNDAI','TOYOTA','RENAULT','HONDA','NISSAN','PEUGEOT','CITROEN','JEEP','CHERY','CAOA','KIA','MITSUBISHI','MERCEDES','MB','VOLVO','SCANIA','IVECO','AUDI','BMW','JAC','RAM','LAND','SUZUKI','BYD','GWM','SPRINTER','AGRALE','TROLLER','MAN','DAF'];
function aplic(d){
  const u=norm(d);
  for(const m of MARCAS){const i=u.indexOf(' '+m+' ');
    if(i>=0){let r=u.slice(i+m.length+2).split(/\s(?:VSF|VFA|VTR|VIG|VAN|LD|LE|CD|CS)\b/)[0].replace(/\(.*?\)/g,'').trim();
      return (m+' '+r).replace(/[-\/]+$/,'').trim().slice(0,52)}}
  return '';
}

function toast(msg,kind='ok'){
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=ico(kind==='err'?'alert':'chk')+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity=0;el.style.transform='translateY(6px)';el.style.transition='.25s';setTimeout(()=>el.remove(),260)},3000);
}
function modal({title,sub,body,footer,wide,onMount}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md ${wide||''}" role="dialog" aria-modal="true">
    <div class="md-h"><div style="flex:1"><h3>${esc(title)}</h3>${sub?`<p>${esc(sub)}</p>`:''}</div>
    <button class="icobtn" data-close>${ico('x')}</button></div>
    <div class="md-b">${body}</div>${footer?`<div class="md-f">${footer}</div>`:''}</div>`;
  $('#layers').appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))close()});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  onMount&&onMount(ov,close);
  return{el:ov,close};
}
function confirmar(title,msg,label='Confirmar',danger=true){
  return new Promise(res=>{
    const m=modal({title,body:`<p style="color:var(--ink-2)">${msg}</p>`,
      footer:`<button class="btn" data-close>Cancelar</button><button class="btn ${danger?'dang':'pri'}" data-ok>${esc(label)}</button>`,
      onMount(ov,close){ov.querySelector('[data-ok]').onclick=()=>{close();res(true)};
        ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))res(false)})}});
  });
}
function popMenu(anchor,items){
  $$('.menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=items.map(i=>i==='-'?'<hr>':`<button class="${i.danger?'d':''}" data-k="${i.k}">${ico(i.icon)}<span>${esc(i.label)}</span></button>`).join('');
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.top=Math.min(r.bottom+6,innerHeight-m.offsetHeight-12)+'px';
  m.style.left=Math.max(10,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-12))+'px';
  m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const it=items.find(i=>i.k===b.dataset.k);m.remove();it&&it.fn&&it.fn()});
  setTimeout(()=>document.addEventListener('click',function h(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('click',h)}}),0);
}
/* cópia para área de transferência com alternativa quando a API está bloqueada */
function copiar(txt,msg){
  const ok=()=>toast(msg||'Copiado');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar aqui','err')}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb();
}
/* tema: claro, escuro ou conforme o sistema */
const mq=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)');
function applyTheme(){
  const t=DB.config?.tema||'claro';
  const dark=t==='escuro'||(t==='auto'&&mq&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const b=document.getElementById('themeBtn');
  if(b){b.innerHTML=ico(dark?'sun':'moon');b.title=dark?'Mudar para tema claro':'Mudar para tema escuro'}
}
mq&&mq.addEventListener&&mq.addEventListener('change',()=>{if(DB.config?.tema==='auto')applyTheme()});
function statusPill(s){return `<span class="pill s-${s.toLowerCase()}"><i></i>${s}</span>`}
const STATUS=['Rascunho','Gerado','Enviado','Aprovado','Recusado','Cancelado'];

/* autocomplete genérico */
function autocomplete(input,search,render,onPick){
  let list=null,items=[],sel=-1;
  const kill=()=>{list&&list.remove();list=null;items=[];sel=-1};
  const open=()=>{
    const q=input.value.trim();items=search(q).slice(0,40);
    if(!list){list=document.createElement('div');list.className='ac-list';input.parentElement.appendChild(list)}
    list.innerHTML=items.length?items.map((it,i)=>`<div class="ac-i ${i===sel?'sel':''}" data-i="${i}">${render(it,q)}</div>`).join('')
      :'<div class="ac-empty">Nada encontrado. Verifique o código ou cadastre em Produtos.</div>';
    list.onclick=e=>{const d=e.target.closest('.ac-i');if(!d)return;onPick(items[+d.dataset.i]);kill()};
  };
  input.addEventListener('focus',open);
  input.addEventListener('input',debounce(open,90));
  input.addEventListener('blur',()=>setTimeout(kill,180));
  input.addEventListener('keydown',e=>{
    if(!list)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(items.length-1,sel+(e.key==='ArrowDown'?1:-1)));
      $$('.ac-i',list).forEach((d,i)=>d.classList.toggle('sel',i===sel));$$('.ac-i',list)[sel]?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();onPick(items[sel]);kill()}
    else if(e.key==='Escape')kill();
  });
}
function hl(txt,q){
  if(!q)return esc(txt);
  const terms=norm(q).split(/\s+/).filter(Boolean);let out=esc(txt);
  terms.forEach(t=>{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');out=out.replace(re,'<mark>$1</mark>')});
  return out;
}
/* busca de produtos por código OU por palavras-chave da descrição */
function buscaProdutos(q){
  const ativos=DB.produtos.filter(p=>p.ativo);
  if(!q)return ativos.slice(0,25);
  const t=norm(q).split(/\s+/).filter(Boolean);
  const dig=q.replace(/\D/g,'');
  const scored=[];
  ativos.forEach((p,idx)=>{
    const c=p.codigo,d=norm(p.descricao);
    let sc=0;
    if(dig&&c===dig)sc=1e5;
    else if(dig&&/\d/.test(q)&&c.startsWith(dig))sc=5e4-c.length;
    if(!sc){
      if(!t.every(w=>d.includes(w)))return;
      sc=200-Math.min(70,d.length/5);
      if(d.startsWith(t[0]))sc+=60;
      sc+=Math.max(0,80-idx/12);           /* base ordenada por recorrência histórica */
      if(p.valor>0)sc+=10;
    }
    scored.push([sc,p]);
  });
  return scored.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
</script>

function drawEvo(el,f){

}
function drawRank(el,f){
  const by={};f.forEach(o=>{const c=cliente(o.cliente_id)?.nome_fantasia||'—';(by[c]=by[c]||{n:0,v:0});by[c].n++;by[c].v+=o.total});
  const arr=Object.entries(by).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  if(!arr.length){el.innerHTML='<div class="empty tiny">Sem clientes no período.</div>';return}
  const mx=arr[0][1].n;
  el.innerHTML=arr.map(([n,d])=>`<div class="bar-row"><span class="nm">${esc(n)}</span>
    <span class="muted tiny" style="flex:0 0 auto">${moneyShort(d.v)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${d.n/mx*100}%"></span></span>
    <span class="vl">${d.n}</span></div>`).join('');
}

  const dark=document.documentElement.dataset.theme==='dark';

  const tot=arr.reduce((a,x)=>a+x[1],0)||1;
  let acc=0,R=54,C2=2*Math.PI*R;
  el.innerHTML=`<div class="row" style="gap:24px;justify-content:center">
    <svg width="150" height="150" viewBox="0 0 150 150">
      ${arr.map(([s,n])=>{const len=n/tot*C2,off=acc;acc+=len;
        return `<circle cx="75" cy="75" r="${R}" fill="none" stroke="${C[s]}" stroke-width="17"
          stroke-dasharray="${len-1.5} ${C2-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`}).join('')}
      <text x="75" y="71" text-anchor="middle" font-size="24" font-weight="600" fill="currentColor" font-family="Poppins">${tot}</text>

    </svg>
    <div style="flex:1;min-width:150px">${arr.map(([s,n])=>`<div class="bar-row"><i style="width:9px;height:9px;border-radius:3px;background:${C[s]};display:inline-block;flex:0 0 9px"></i>
      <span class="nm">${s}</span><span class="vl">${n}</span><span class="muted tiny" style="width:38px;text-align:right">${(n/tot*100).toFixed(0)}%</span></div>`).join('')}</div></div>`;
}

/* ───────────────────────── ORÇAMENTOS ───────────────────────── */
let oF={q:'',cli:'',an:'',uni:'',st:'',ts:'',de:'',ate:''},sel=new Set();
function vOrc(){
  const v=$('#view');
  $('#topActions').innerHTML=`<button class="btn pri" onclick="go('novo')">${ico('plus')}Novo orçamento</button>`;
  const list=DB.orcamentos.filter(o=>{

    return (!oF.q||hay.includes(norm(oF.q)))&&(!oF.cli||o.cliente_id===oF.cli)&&(!oF.an||o.analista_id===oF.an)
      &&(!oF.uni||o.unidade_id===oF.uni)&&(!oF.st||o.status===oF.st)&&(!oF.ts||o.tipo_servico===oF.ts)
      &&(!oF.de||o.data>=oF.de)&&(!oF.ate||o.data<=oF.ate);
  }).sort((a,b)=>b.created_at.localeCompare(a.created_at));

  v.innerHTML=`
  <div class="card pad" style="margin-bottom:16px">
    <div class="row">
      <div class="ac" style="flex:2;min-width:230px;position:relative">
        <span style="position:absolute;left:12px;top:11px;color:var(--ink-4);display:flex">${ico('srch')}</span>
        <input class="inp" id="oq" placeholder="Buscar por número, placa, OS, cliente ou produto…" value="${esc(oF.q)}" style="padding-left:38px">
      </div>
      <button class="btn" id="oFil">${ico('fltr')}Filtros${Object.entries(oF).filter(([k,x])=>k!=='q'&&x).length?` <span class="tag">${Object.entries(oF).filter(([k,x])=>k!=='q'&&x).length}</span>`:''}</button>
      <div class="spacer"></div>
      <span class="muted tiny">${list.length} de ${DB.orcamentos.length}</span>
    </div>
    <div id="oFilBox" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr))">
        <label class="f"><span>Cliente</span><select class="inp" data-f="cli"><option value="">Todos</option>${DB.clientes.map(c=>`<option value="${c.id}" ${oF.cli===c.id?'selected':''}>${esc(c.nome_fantasia)}</option>`).join('')}</select></label>
        <label class="f"><span>Analista</span><select class="inp" data-f="an"><option value="">Todos</option>${DB.analistas.map(a=>`<option value="${a.id}" ${oF.an===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select></label>
        <label class="f"><span>Unidade</span><select class="inp" data-f="uni"><option value="">Todas</option>${DB.unidades.map(u=>`<option value="${u.id}" ${oF.uni===u.id?'selected':''}>${esc(u.codigo)} · ${esc(u.cidade)}</option>`).join('')}</select></label>
        <label class="f"><span>Status</span><select class="inp" data-f="st"><option value="">Todos</option>${STATUS.map(s=>`<option ${oF.st===s?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="f"><span>Tipo de serviço</span><select class="inp" data-f="ts"><option value="">Todos</option>${['Serviço na unidade','Serviço móvel','Entrega','Outro'].map(s=>`<option ${oF.ts===s?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="f"><span>De</span><input type="date" class="inp" data-f="de" value="${oF.de}"></label>
        <label class="f"><span>Até</span><input type="date" class="inp" data-f="ate" value="${oF.ate}"></label>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="oClr">${ico('refresh')}Limpar filtros</button></div>
    </div>
  </div>
  <div class="card">
    ${list.length?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox" id="ckAll"></th><th>Número</th><th>Cliente</th>
      <th>Identificação</th><th>Unidade</th><th>Data</th><th class="num">Valor</th><th>Status</th><th style="width:44px"></th></tr></thead>
      <tbody>${list.map(o=>{const c=cliente(o.cliente_id),u=unidade(o.unidade_id),dr=diasRestantes(o);
        return `<tr data-id="${o.id}">
        <td class="ck"><input type="checkbox" class="ck1" data-id="${o.id}" ${sel.has(o.id)?'checked':''}></td>
        <td><b class="mono">${o.numero}</b>${o.versao>1?`<span class="tag" style="margin-left:5px">v${o.versao}</span>`:''}
          <div class="tiny muted">${esc(analista(o.analista_id)?.nome?.split(' ').slice(0,2).join(' ')||'—')}</div></td>
        <td><span class="trunc" style="max-width:190px">${esc(c?.nome_fantasia||'—')}</span>
          <div class="tiny muted">${o.itens.length} item${o.itens.length>1?'s':''}</div></td>
        <td class="tiny"><b>${esc(o.ident_valor||'—')}</b><div class="muted">${esc(o.ident_tipo)}${o.veiculo?' · '+esc(o.veiculo):''}</div></td>
        <td class="tiny">${esc(u?.codigo||'—')}<div class="muted">${esc(u?.cidade||'')}</div></td>
        <td class="tiny">${dBR(o.data)}<div class="muted">${['Gerado','Enviado'].includes(o.status)?(dr<0?'vencido':dr+'d p/ vencer'):''}</div></td>

        <td>${statusPill(o.status)}</td>
        <td><button class="icobtn" data-more="${o.id}" style="border:0;width:28px;height:28px">${ico('dots')}</button></td>

  $('#oClr')&&($('#oClr').onclick=()=>{oF={q:oF.q,cli:'',an:'',uni:'',st:'',ts:'',de:'',ate:''};vOrc()});
  const ckAll=$('#ckAll');
  if(ckAll){ckAll.checked=list.length&&list.every(o=>sel.has(o.id));

  $$('.ck1').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);bulk(list)});
  $$('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();rowMenu(b,b.dataset.more)});

function bulk(list){
  const b=$('#bulkBar');if(!b)return;
  if(!sel.size){b.innerHTML='';return}
  b.innerHTML=`<div class="bulk"><b>${sel.size} selecionado${sel.size>1?'s':''}</b>
    <div class="spacer"></div>
    <button class="btn sm" data-a="pdf">${ico('dl')}Baixar PDFs</button>
    <button class="btn sm" data-a="mail">${ico('mail')}Enviar por e-mail</button>
    <button class="btn sm" data-a="st">${ico('tag')}Alterar status</button>
    <button class="btn sm" data-a="del">${ico('trash')}Excluir</button>
    <button class="btn sm" data-a="clr">${ico('x')}Limpar</button></div>`;
  b.querySelector('[data-a="clr"]').onclick=()=>{sel.clear();vOrc()};
  b.querySelector('[data-a="pdf"]').onclick=()=>baixarLote([...sel]);
  b.querySelector('[data-a="mail"]').onclick=()=>mailModal([...sel]);
  b.querySelector('[data-a="st"]').onclick=e=>popMenu(e.currentTarget,STATUS.map(s=>({k:s,label:s,icon:'tag',
    fn:()=>{[...sel].forEach(id=>{const o=orc(id);if(o.status!==s){o.status=s;hist(o,'Status alterado para "'+s+'"')}});save('orc');toast(sel.size+' orçamento(s) atualizados');vOrc()}})));
  b.querySelector('[data-a="del"]').onclick=async()=>{
    if(await confirmar('Excluir orçamentos',`Excluir ${sel.size} orçamento(s)? Esta ação não pode ser desfeita.`,'Excluir')){
      DB.orcamentos=DB.orcamentos.filter(o=>!sel.has(o.id));save('orc');toast(sel.size+' orçamento(s) excluídos');sel.clear();vOrc()}};
}
function rowMenu(btn,id){
  const o=orc(id);
  popMenu(btn,[
    {k:'ed',label:'Abrir / editar',icon:'edit',fn:()=>go('novo',id)},
    {k:'pdf',label:'Gerar e baixar PDF',icon:'dl',fn:()=>gerarPDF(o,true)},
    {k:'prev',label:'Pré-visualizar',icon:'eye',fn:()=>previewPDF(o)},
    {k:'mail',label:'Enviar por e-mail',icon:'mail',fn:()=>mailModal([id])},
    '-',
    {k:'dup',label:'Duplicar orçamento',icon:'copy',fn:()=>duplicar(o)},
    {k:'ver',label:'Criar nova versão',icon:'layers',fn:()=>novaVersao(o)},
    {k:'lnk',label:'Copiar link público',icon:'ext',fn:()=>copiar(linkPublico(o),'Link copiado')},
    {k:'hist',label:'Histórico',icon:'clock',fn:()=>histModal(o)},
    '-',
    {k:'st',label:'Alterar status',icon:'tag',fn:()=>setTimeout(()=>popMenu(btn,STATUS.map(s=>({k:s,label:s,icon:'tag',
      fn:()=>{o.status=s;hist(o,'Status alterado para "'+s+'"');save('orc');toast('Status: '+s);vOrc()}}))),10)},
    {k:'del',label:'Excluir',icon:'trash',danger:true,fn:async()=>{
      if(await confirmar('Excluir orçamento',`Excluir ${o.numero}? Esta ação não pode ser desfeita.`,'Excluir')){
        DB.orcamentos=DB.orcamentos.filter(x=>x.id!==id);save('orc');toast('Orçamento excluído');vOrc()}}},
  ]);
}
function linkPublico(o){return (DB.config.urlPublica||'')+o.numero+(o.versao>1?'-v'+o.versao:'')}
function duplicar(o){
  const n={...clone(o),id:uid(),numero:proxNumero(),versao:1,pai_id:null,status:'Rascunho',
    data:today(),created_at:new Date().toISOString(),hist:[]};
  DB.config.proxNumero=(DB.config.proxNumero||1)+1;
  hist(n,'Orçamento duplicado de '+o.numero);
  DB.orcamentos.unshift(n);save('orc');save('meta');toast('Duplicado como '+n.numero);go('novo',n.id);
}
function novaVersao(o){
  const n={...clone(o),id:uid(),versao:(o.versao||1)+1,pai_id:o.id,status:'Rascunho',
    created_at:new Date().toISOString(),hist:[]};
  hist(n,'Versão '+n.versao+' criada a partir da versão '+(o.versao||1));
  DB.orcamentos.unshift(n);save('orc');toast(o.numero+' — versão '+n.versao+' criada');go('novo',n.id);
}
function histModal(o){
  modal({title:'Histórico · '+o.numero,sub:(o.hist||[]).length+' registro(s)',
    body:(o.hist||[]).length?`<div class="hist">${o.hist.map(h=>`<div class="hist-i"><div class="hist-d"></div>
      <div><b>${esc(h.acao)}</b><small>${dtBR(h.data)} · ${esc(h.usuario)}</small></div></div>`).join('')}</div>`
      :'<div class="empty tiny">Nenhum evento registrado.</div>',
    footer:`<button class="btn" data-close>Fechar</button>`});
}
</script>

function prog(){
  const need=[B.ident_valor,B.cliente_id,B.unidade_id,B.itens.length&&B.itens.every(i=>i.codigo&&num(i.valor_unit)>0),
    !['Serviço móvel','Entrega'].includes(B.tipo_servico)||B.endereco.logradouro];
  return Math.round(need.filter(Boolean).length/need.length*100);
}

  $('#iVal').oninput=e=>{B.validade_dias=parseInt(e.target.value.replace(/\D/g,''))||DB.config.validade};

function softTotals(){
  const s=$('.side');if(!s)return;
  s.querySelectorAll('.tot-line')[0].lastElementChild.textContent=money(B.subtotal);
  s.querySelectorAll('.tot-line')[1].lastElementChild.textContent=money(B.instalacao);
  s.querySelector('.tot-line.big b').textContent=money(B.total);
  $$('#view .tbl tbody tr').forEach((tr,i)=>{const c=tr.querySelector('td.num');if(c&&B.itens[i])c.textContent=money(B.itens[i].valor_total)});
}
function validar(){
  const e=[];
  if(!B.ident_valor)e.push('Informe a '+B.ident_tipo.toLowerCase());
  if(!B.cliente_id)e.push('Selecione o cliente');
  if(!B.unidade_id)e.push('Selecione a unidade');
  if(!B.itens.length)e.push('Adicione ao menos um produto');
  if(B.itens.some(i=>!i.codigo))e.push('Há item sem produto selecionado');
  if(B.itens.some(i=>num(i.valor_unit)<=0))e.push('Há item sem valor unitário');
  if(['Serviço móvel','Entrega'].includes(B.tipo_servico)&&!B.endereco.logradouro)e.push('Informe o endereço do atendimento');
  return e;
}
function persist(silent){
  const e=validar();
  if(e.length&&!silent){toast(e[0],'err');return false}
  calcOrc(B);
  const ex=DB.orcamentos.findIndex(o=>o.id===B.id);
  B.updated_at=new Date().toISOString();
  if(ex<0){
    hist(B,'Orçamento criado');
    if(B.novo&&B.numero===proxNumero()){DB.config.proxNumero=(DB.config.proxNumero||1)+1;save('meta')}
    B.novo=false;DB.orcamentos.unshift(clone(B));
  } else DB.orcamentos[ex]=clone(B);
  save('orc');
  return true;
}
/* ── consulta de placa (adaptador configurável) ── */
async function consultaPlaca(){
  const pl=norm(B.ident_valor).replace(/[^A-Z0-9]/g,'');
  if(pl.length<7){toast('Informe a placa completa','err');return}
  const cfg=DB.config;
  if(!cfg.placaApi){
    modal({title:'Consulta de placa',body:`<p style="color:var(--ink-2);line-height:1.7">
      Não existe API pública e gratuita que devolva marca/modelo a partir da placa: os dados são do Denatran e são
      distribuídos por provedores comerciais (apiplacas.com.br, Placa&nbsp;FIPE, Infosimples, entre outros) ou pelo
      SINESP, que exige convênio.<br><br>
      O sistema já tem o adaptador pronto. Em <b>Configurações → Integrações</b>, informe a URL do provedor usando
      <code>{placa}</code> e <code>{token}</code> como marcadores, por exemplo:<br>
      <code style="display:block;background:var(--code-bg);padding:9px;border-radius:8px;margin:9px 0;font-size:12px">
      https://api.provedor.com.br/consulta?placa={placa}&amp;token={token}</code>
      A resposta é lida procurando campos como <code>modelo</code>, <code>marca</code>, <code>ano</code> ou
      <code>MODELO</code>. Enquanto isso, ao escolher o produto o sistema preenche o veículo pela própria descrição
      da peça (ex.: <i>VID PB GM ONIX 20/</i> → <i>GM ONIX 20</i>).</p>`,
      footer:`<button class="btn" data-close>Entendi</button><button class="btn pri" id="goCfg">Abrir configurações</button>`,
      onMount(ov,close){ov.querySelector('#goCfg').onclick=()=>{close();go('cfg')}}});
    return;
  }
  toast('Consultando placa '+pl+'…');
  try{
    const url=cfg.placaApi.replace('{placa}',encodeURIComponent(pl)).replace('{token}',encodeURIComponent(cfg.placaToken||''));
    const r=await fetch(url,{headers:cfg.placaToken?{Authorization:'Bearer '+cfg.placaToken}:{}});
    const j=await r.json();
    const pick=(...ks)=>{for(const k of ks){const v=deep(j,k);if(v)return String(v)}return''};
    const marca=pick('marca','MARCA','brand'),modelo=pick('modelo','MODELO','model'),ano=pick('ano','anoModelo','ANO_MODELO','year');
    const txt=[marca,modelo,ano].filter(Boolean).join(' ').trim();
    if(!txt)throw new Error('resposta sem modelo');
    B.veiculo=txt;renderBuilder();toast('Veículo: '+txt);
  }catch(err){toast('Não foi possível consultar a placa ('+err.message+')','err')}
}
function deep(o,k){if(!o||typeof o!=='object')return null;if(o[k]!=null&&typeof o[k]!=='object')return o[k];
  for(const v of Object.values(o)){const r=deep(v,k);if(r!=null)return r}return null}
async function buscaCEP(){
  const cep=String(B.endereco.cep||'').replace(/\D/g,'');
  if(cep.length!==8){toast('CEP inválido','err');return}
  try{
    const r=await fetch('https://brasilapi.com.br/api/cep/v2/'+cep);
    if(!r.ok)throw new Error('CEP não encontrado');
    const j=await r.json();
    B.endereco.logradouro=j.street||'';B.endereco.bairro=j.neighborhood||'';
    B.endereco.cidade=j.city||'';B.endereco.uf=j.state||'';
    renderBuilder();toast('Endereço preenchido');
  }catch(e){toast('Busca de CEP indisponível aqui — preencha manualmente','err')}
}
/* ── revisão ── */
function revisar(){
  const e=validar();
  if(e.length){toast(e[0],'err');return}
  calcOrc(B);
  const c=cliente(B.cliente_id),u=unidade(B.unidade_id),a=analista(B.analista_id||c?.analista_id);
  const local=B.tipo_servico==='Serviço na unidade'
    ?[u.razao_social,u.endereco,[u.cidade,u.estado].filter(Boolean).join(' — '),u.telefone].filter(Boolean).join(' · ')
    :[[B.endereco.logradouro,B.endereco.numero].filter(Boolean).join(', '),B.endereco.compl,B.endereco.bairro,
      [B.endereco.cidade,B.endereco.uf].filter(Boolean).join('/'),B.endereco.cep].filter(Boolean).join(' · ');
  modal({title:'Revisão do orçamento',sub:B.numero+(B.versao>1?' · versão '+B.versao:''),wide:'wide',
    body:`<div class="grid g2" style="gap:20px">
      <div><div class="prev-lb">Cliente</div><b>${esc(c.nome_fantasia||c.razao_social)}</b>
        <div class="tiny muted">${esc(c.razao_social)}${c.cnpj?'<br>CNPJ '+esc(c.cnpj):''}</div></div>
      <div><div class="prev-lb">Identificação</div><b>${esc(B.ident_tipo)}: ${esc(B.ident_valor)}</b>
        <div class="tiny muted">${esc(B.veiculo||'Veículo não informado')}</div></div>
      <div><div class="prev-lb">Atendimento</div><b>${esc(B.tipo_servico)}</b>
        <div class="tiny muted">${esc(local)}</div></div>
      <div><div class="prev-lb">Datas</div><b>Orçamento ${dBR(B.data)}</b>
        <div class="tiny muted">${B.data_agend?'Agendamento '+dBR(B.data_agend)+(B.hora_agend?' às '+B.hora_agend:''):'Sem agendamento'} · Validade ${B.validade_dias} dias</div></div>
    </div>
    <div class="prev-lb" style="margin-top:22px">Produtos</div>
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:12px">
      <table class="tbl"><thead><tr><th>Código</th><th>Produto</th><th style="width:50px">Qtd</th><th class="num">Valor</th></tr></thead>
      <tbody>${B.itens.map(i=>`<tr><td class="mono tiny">${esc(i.codigo)}</td>
        <td><span class="trunc" style="max-width:330px">${esc(i.descricao)}</span>
        ${legendaItem(i,B)?`<div class="tiny muted">${esc(legendaItem(i,B))}</div>`:''}</td>
        <td>${i.qtd}</td><td class="num strong">${money(i.valor_total)}</td></tr>`).join('')}</tbody></table></div>
    ${B.obs.length?`<div class="prev-lb" style="margin-top:20px">Observações</div>
      <ul style="padding-left:18px;color:var(--ink-2);font-size:13px;line-height:1.8">${B.obs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
    <div class="row" style="margin-top:22px;padding:16px 20px;background:var(--ag-50);border-radius:12px">
      <div><div class="prev-lb" style="margin:0">Total do orçamento</div>
        <div class="tiny muted">${esc(a?.nome||'')}</div></div>
      <div class="spacer"></div>
      <b style="font-size:26px;color:var(--ag);letter-spacing:-.02em">${money(B.total)}</b></div>`,
    footer:`<button class="btn" data-close>Editar orçamento</button>
      <button class="btn" id="rSave">${ico('save')}Salvar</button>
      <button class="btn pri" id="rPdf">${ico('dl')}Gerar PDF</button>`,
    onMount(ov,close){
      ov.querySelector('#rSave').onclick=()=>{if(persist()){close();toast('Orçamento salvo');vNovo(B.id)}};
      ov.querySelector('#rPdf').onclick=()=>{if(persist()){close();gerarPDF(B,true);vNovo(B.id)}};
    }});
}
addEventListener('keydown',e=>{
  if(ROUTE.k!=='novo'||!B)return;
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(persist())toast('Orçamento salvo')}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.target.matches('textarea')){e.preventDefault();revisar()}
  if(e.altKey&&e.key.toLowerCase()==='a'){e.preventDefault();$('#bAddItem')?.click()||$('#bAddItem2')?.click()}
});

<script>
/* ═══════════════════ GERAÇÃO DE PDF ═══════════════════ */
const AGB=[22,65,148],INK=[19,26,43],INK2=[63,74,99],INK3=[107,118,144],LINE=[228,232,241],SOFT=[246,248,252];
const M=16, PW=210, PH=297, CW=PW-M*2;

function imgSize(dataUrl){ // dimensões reais via cache sincrono
  const i=IMGCACHE[dataUrl];return i||{w:100,h:40};
}
const IMGCACHE={};
function preload(urls){
  return Promise.all(urls.filter(Boolean).map(u=>new Promise(res=>{
    if(IMGCACHE[u])return res();
    const im=new Image();im.onload=()=>{IMGCACHE[u]={w:im.naturalWidth,h:im.naturalHeight};res()};
    im.onerror=()=>{IMGCACHE[u]={w:100,h:40};res()};im.src=u;})));
}
async function buildPDF(o){
  const c=cliente(o.cliente_id)||{},u=unidade(o.unidade_id)||{},a=analista(o.analista_id||c.analista_id)||{},cfg=DB.config;
  await preload([cfg.logo,c.logo]);
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({unit:'mm',format:'a4',compress:true});
  d.setFont('helvetica','normal');
  let y=0;

  const txt=(s,x,yy,{size=9,style='normal',color=INK,align='left',max=null,lh=1.35}={})=>{
    d.setFont('helvetica',style);d.setFontSize(size);d.setTextColor(...color);
    const lines=max?d.splitTextToSize(String(s??''),max):[String(s??'')];
    lines.forEach((l,i)=>d.text(l,x,yy+i*size*0.3528*lh,{align}));
    return lines.length*size*0.3528*lh;
  };
  const label=(s,x,yy)=>{d.setFont('helvetica','bold');d.setFontSize(6.6);d.setTextColor(...INK3);
    d.text(String(s).toUpperCase(),x,yy,{charSpace:.5});};
  const rule=(yy,x1=M,x2=PW-M,col=LINE,w=.3)=>{d.setDrawColor(...col);d.setLineWidth(w);d.line(x1,yy,x2,yy)};
  const fmt=u=>/^data:image\/(jpe?g)/i.test(u||'')?'JPEG':'PNG';
  const img=(url,x,yy,maxW,maxH)=>{
    if(!url)return 0;
    const s=imgSize(url);const r=Math.min(maxW/s.w,maxH/s.h);
    const w=s.w*r,h=s.h*r;
    try{d.addImage(url,fmt(url),x,yy,w,h)}catch(e){return 0}
    return w;
  };
  const chk=(need,onNew)=>{if(y+need>PH-38){footer();d.addPage();y=M;onNew&&onNew()}};

  /* ── cabeçalho ── */
  y=M;
  const agW=img(cfg.logo,M,y,42,12);
  if(c.logo){
    const s=imgSize(c.logo),r=Math.min(34/s.w,10/s.h),w=s.w*r,h=s.h*r;
    d.setDrawColor(...LINE);d.setLineWidth(.3);d.line(PW-M-w-9,y+1,PW-M-w-9,y+10.5);
    try{d.addImage(c.logo,fmt(c.logo),PW-M-w,y+(11-h)/2,w,h)}catch(e){}
  }
  y+=15;
  d.setFillColor(...AGB);d.rect(M,y,CW,1.1,'F');
  y+=9;

  /* título + número */
  txt('Orçamento comercial',M,y+1,{size:17,style:'bold',color:INK});
  txt(o.numero+(o.versao>1?'  ·  versão '+o.versao:''),M,y+7.4,{size:9.5,style:'bold',color:AGB});
  const rx=PW-M,lx=PW-M-64;
  label('Data',lx,y-1.5);
  txt(dBR(o.data),rx,y-1.5,{size:9,style:'bold',align:'right'});
  label('Validade',lx,y+4);
  txt(o.validade_dias+' dias — até '+dBR(vencimento(o)),rx,y+4,{size:8.4,align:'right'});
  if(o.data_agend){
    label('Agendamento',lx,y+9.5);
    txt(dBR(o.data_agend)+(o.hora_agend?' às '+o.hora_agend:''),rx,y+9.5,{size:8.4,style:'bold',color:AGB,align:'right'});
  }
  y+=15;

  /* ── cliente / identificação ── */
  const colW=(CW-8)/2;
  const boxTop=y;
  d.setFillColor(...SOFT);d.roundedRect(M,y,colW,32,2.2,2.2,'F');
  d.setFillColor(...SOFT);d.roundedRect(M+colW+8,y,colW,32,2.2,2.2,'F');
  label('Cliente',M+6,y+7);
  txt(c.nome_fantasia||c.razao_social||'—',M+6,y+13,{size:10.5,style:'bold',max:colW-12});
  let cy=y+18;
  [c.razao_social!==(c.nome_fantasia||'')?c.razao_social:'',c.cnpj?'CNPJ '+c.cnpj:'',
   [c.telefone,c.email].filter(Boolean).join('  ·  ')].filter(Boolean).slice(0,3).forEach(l=>{
    cy+=txt(l,M+6,cy,{size:7.6,color:INK2,max:colW-12});});

  const x2=M+colW+8+6;
  label('Identificação',x2,y+7);
  txt(o.ident_tipo.toUpperCase(),x2,y+12.5,{size:7.2,style:'bold',color:AGB});
  txt(o.ident_valor||'—',x2,y+18,{size:13,style:'bold'});
  if(o.veiculo)txt(o.veiculo,x2,y+23.5,{size:8,color:INK2,max:colW-12});
  y+=38;

  /* ── local do serviço ── */
  label('Local do serviço',M,y);
  y+=5.5;
  txt(o.tipo_servico,M,y,{size:9.5,style:'bold'});
  y+=4.6;
  let loc=[];
  if(o.tipo_servico==='Serviço na unidade'){
    loc=[u.razao_social,[u.cnpj?'CNPJ '+u.cnpj:''].filter(Boolean).join(''),u.endereco,
      [[u.cidade,u.estado].filter(Boolean).join(' — '),u.cep?'CEP '+u.cep:''].filter(Boolean).join('  ·  '),
      [u.telefone?'Tel. '+u.telefone+(u.ramal?'  ramal '+u.ramal:''):'',u.email].filter(Boolean).join('  ·  ')];
  }else{
    const e=o.endereco||{};
    loc=[[e.logradouro,e.numero].filter(Boolean).join(', ')+(e.compl?' — '+e.compl:''),
      [e.bairro,[e.cidade,e.uf].filter(Boolean).join('/')].filter(Boolean).join('  ·  '),
      e.cep?'CEP '+e.cep:'',
      'Unidade responsável: '+[u.codigo,u.razao_social,u.telefone?'Tel. '+u.telefone+(u.ramal?' ramal '+u.ramal:''):''].filter(Boolean).join('  ·  ')];
  }
  loc.filter(Boolean).forEach(l=>{y+=txt(l,M,y,{size:8,color:INK2,max:CW})});
  y+=8;

  /* ── tabela de produtos ── */
  const C1=M,C2=M+34,C3=PW-M-46,C4=PW-M-32,C5=PW-M;
  const thead=()=>{
    d.setFillColor(...SOFT);d.rect(M,y,CW,8,'F');
    label('Código',C1+3,y+5.3);label('Produto / serviço',C2,y+5.3);
    d.setFont('helvetica','bold');d.setFontSize(6.6);d.setTextColor(...INK3);
    d.text('QTD.',C4-3,y+5.3,{align:'right',charSpace:.5});d.text('VALOR',C5-3,y+5.3,{align:'right',charSpace:.5});
    y+=8;rule(y);
  };
  const contHeader=()=>{
    txt(o.numero+(o.versao>1?' · v'+o.versao:''),M,y+2,{size:8,style:'bold',color:AGB});
    txt((c.nome_fantasia||c.razao_social||'')+' · continuação',PW-M,y+2,{size:7.6,color:INK3,align:'right'});
    y+=7;rule(y);y+=5;
  };
  thead();
  o.itens.forEach(it=>{
    const desc=d.splitTextToSize(it.descricao||'—',C3-C2-4);
    const leg=legendaItem(it,o);
    const h=Math.max(11,desc.length*3.6+(leg?4:0)+7);
    chk(h+16,()=>{contHeader();thead()});
    let ty=y+5.6;
    txt(it.codigo,C1+3,ty,{size:7.6,style:'bold',color:AGB});
    d.setFont('helvetica','normal');d.setFontSize(8.6);d.setTextColor(...INK);
    desc.forEach((l,i)=>d.text(l,C2,ty+i*3.6));
    if(leg)txt(leg,C2,ty+desc.length*3.6+1.4,{size:7,style:'italic',color:INK3,max:C3-C2-4});
    txt(String(it.qtd),C4-3,ty,{size:8.6,align:'right'});
    txt(money(it.valor_total),C5-3,ty,{size:9.6,style:'bold',align:'right'});
    y+=h;rule(y,M,PW-M,[238,241,247]);
  });

  /* ── total ── */
  y+=7;chk(30);
  const tw=76;
  d.setFillColor(...AGB);d.roundedRect(PW-M-tw,y,tw,17,2.2,2.2,'F');
  d.setFont('helvetica','bold');d.setFontSize(6.6);d.setTextColor(255,255,255);
  d.text('TOTAL DO ORÇAMENTO',PW-M-tw+7,y+6.6,{charSpace:.5});
  txt(money(o.total),PW-M-7,y+13.4,{size:14.5,style:'bold',color:[255,255,255],align:'right'});
  if(o.instalacao>0)txt('Valores já incluem os serviços de instalação.',M,y+11,{size:7.4,style:'italic',color:INK3,max:CW-tw-8});
  y+=24;

  /* ── observações ── */
  if(o.obs&&o.obs.length){
    const lines=o.obs.map(t=>d.splitTextToSize('•  '+t,CW-14));
    const hh=lines.flat().length*3.9+11;
    chk(hh+8);
    d.setFillColor(253,251,244);d.setDrawColor(240,231,205);d.setLineWidth(.3);
    d.roundedRect(M,y,CW,hh,2.2,2.2,'FD');
    label('Observações',M+7,y+7);
    let oy=y+12.4;
    lines.forEach(ls=>{ls.forEach((l,i)=>{txt(l,M+7+(i?3:0),oy,{size:8,color:INK2});oy+=3.9});oy+=.8});
    y+=hh+8;
  }

  /* ── rodapé ── */
  function footer(){
    const fy=PH-32;
    rule(fy,M,PW-M);
    label('Consultor responsável',M,fy+6);
    txt(a.nome||cfg.usuario||'—',M,fy+11.8,{size:10,style:'bold'});
    const ct=[a.whatsapp?'WhatsApp '+a.whatsapp:'',a.telefone?'Tel. '+a.telefone:''].filter(Boolean).join('   ·   ');
    txt(ct,M,fy+16.6,{size:7.8,color:INK2});
    txt(a.email||cfg.mailRemetente||'',M,fy+20.8,{size:7.8,color:AGB});
    /* QR Code de consulta online — caixa fixa de 19 mm */
    if(cfg.qrcode&&window.qrcode){
      try{
        const q=qrcode(0,'M');q.addData(linkPublico(o));q.make();
        const n=q.getModuleCount(),qs=19,cell=qs/n,qx=PW-M-qs,qy=fy+5;
        d.setFillColor(255,255,255);d.rect(qx-1.2,qy-1.2,qs+2.4,qs+2.4,'F');
        d.setFillColor(0,0,0);
        for(let r=0;r<n;r++)for(let cl=0;cl<n;cl++)if(q.isDark(r,cl))d.rect(qx+cl*cell,qy+r*cell,cell+.02,cell+.02,'F');
        txt('Consultar orçamento',qx-4,fy+13,{size:6.6,color:INK3,align:'right'});
        txt('online',qx-4,fy+16.2,{size:6.6,color:INK3,align:'right'});
      }catch(e){}
    }
    txt(cfg.msgRodape||'',M,PH-7,{size:6.6,color:INK3,max:CW-26});
    txt(String(d.getCurrentPageInfo().pageNumber),PW-M,PH-7,{size:6.6,color:INK3,align:'right'});
  }
  footer();
  return d;
}
async function gerarPDF(o,download){
  try{
    const d=await buildPDF(o);
    const nome=`${o.numero}${o.versao>1?'-v'+o.versao:''}_${(cliente(o.cliente_id)?.nome_fantasia||'cliente').replace(/[^\w]+/g,'-').slice(0,24)}.pdf`;
    if(download){
      d.save(nome);
      const t=orc(o.id);
      if(t){if(t.status==='Rascunho')t.status='Gerado';hist(t,'PDF gerado');save('orc');
        if(B&&B.id===t.id){B.status=t.status;B.hist=t.hist}}
      toast('PDF gerado · '+nome);
      if(ROUTE.k==='orc')vOrc();
    }
    return {doc:d,nome,blob:d.output('blob')};
  }catch(e){console.error(e);toast('Erro ao gerar PDF: '+e.message,'err')}
}
async function previewPDF(o){
  const r=await gerarPDF(o,false);if(!r)return;
  const url=URL.createObjectURL(r.blob);
  modal({title:'Prévia · '+o.numero,sub:r.nome,wide:'xl',
    body:`<iframe src="${url}" style="width:100%;height:66vh;border:1px solid var(--line);border-radius:10px"></iframe>
      <div class="hint" style="margin-top:8px">Se a prévia não abrir neste ambiente, use Baixar PDF — o arquivo é o mesmo.</div>`,
    footer:`<button class="btn" data-close>Fechar</button><button class="btn pri" id="pD">${ico('dl')}Baixar PDF</button>`,
    onMount(ov,close){ov.querySelector('#pD').onclick=()=>{gerarPDF(o,true);close()}}});
}
async function baixarLote(ids){
  if(ids.length===1)return gerarPDF(orc(ids[0]),true);
  toast('Gerando '+ids.length+' PDFs…');
  try{
    const zip=new JSZip();
    for(const id of ids){
      const o=orc(id);const r=await gerarPDF(o,false);if(!r)continue;
      zip.file(r.nome,r.blob);
      if(o.status==='Rascunho')o.status='Gerado';hist(o,'PDF gerado (lote)');
    }
    save('orc');
    const blob=await zip.generateAsync({type:'blob'});
    dl(blob,'ORCAMENTOS_'+today().split('-').reverse().join('-')+'.zip');
    toast(ids.length+' PDFs baixados em .zip');vOrc();
  }catch(e){toast('Falha ao compactar: '+e.message,'err')}
}
/* ═══════════════════ E-MAIL ═══════════════════ */
function tpl(s,o){
  const c=cliente(o.cliente_id)||{},a=analista(o.analista_id||c.analista_id)||{};
  return String(s||'').replace(/\{numero\}/g,o.numero).replace(/\{cliente\}/g,c.nome_fantasia||c.razao_social||'')
    .replace(/\{identificacao\}/g,identLabel(o)).replace(/\{total\}/g,money(o.total))
    .replace(/\{validade\}/g,o.validade_dias).replace(/\{consultor\}/g,a.nome||DB.config.usuario||'');
}
function mailModal(ids){
  const os=ids.map(orc).filter(Boolean);if(!os.length)return;
  const cfg=DB.config,first=os[0],c=cliente(first.cliente_id)||{};
  const assunto=os.length>1?`Orçamentos Autoglass — ${os.length} documentos`:tpl(cfg.mailAssunto,first);
  const corpo=os.length>1
    ? `Olá,\n\nSeguem em anexo ${os.length} orçamentos:\n\n${os.map(o=>`• ${o.numero} — ${identLabel(o)} — ${money(o.total)}`).join('\n')}\n\nTotal: ${money(os.reduce((s,o)=>s+o.total,0))}\n\nAtenciosamente,\n${DB.config.usuario}`
    : tpl(cfg.mailCorpo,first);
  modal({title:'Enviar orçamento por e-mail',sub:os.map(o=>o.numero).join(', '),wide:'wide',
    body:`<div class="grid" style="gap:14px">
      <label class="f"><span>Destinatário <i>*</i></span><input class="inp" id="mTo" value="${esc(c.email||'')}" placeholder="cliente@empresa.com.br"></label>
      <div class="grid g2"><label class="f"><span>CC</span><input class="inp" id="mCc" placeholder="opcional"></label>
      <label class="f"><span>Remetente</span><input class="inp" value="${esc(cfg.mailRemetente)}" disabled></label></div>
      <label class="f"><span>Assunto</span><input class="inp" id="mSub" value="${esc(assunto)}"></label>
      <label class="f"><span>Mensagem</span><textarea class="inp" id="mBody" style="min-height:170px">${esc(corpo)}</textarea></label>
      <div class="row" style="gap:8px;padding:12px;background:var(--ag-50);border-radius:10px">
        <span style="color:var(--ag);display:flex">${ico('file')}</span>
        <span class="tiny">${os.length} PDF${os.length>1?'s':''} em anexo${os.length>1?' (enviados juntos, respeitando o limite de tamanho do provedor)':''}</span>
      </div>
      ${cfg.mailApi?'':`<div class="row" style="gap:8px;padding:12px;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px">
        <span style="color:var(--warn);display:flex">${ico('alert')}</span>
        <span class="tiny">Nenhum serviço de envio configurado. O sistema vai baixar os anexos e abrir seu cliente de e-mail com a mensagem pronta.
        Para envio automático, informe o endpoint em <b>Configurações → E-mail</b>.</span></div>`}
    </div>`,
    footer:`<button class="btn" data-close>Cancelar</button>
      <button class="btn" id="mCopy">${ico('copy')}Copiar mensagem</button>
      <button class="btn pri" id="mSend">${ico('send')}${cfg.mailApi?'Enviar agora':'Preparar envio'}</button>`,
    onMount(ov,close){
      ov.querySelector('#mCopy').onclick=()=>copiar(ov.querySelector('#mBody').value,'Mensagem copiada');
      ov.querySelector('#mSend').onclick=async()=>{
        const to=ov.querySelector('#mTo').value.trim();
        if(!/.+@.+\..+/.test(to)){toast('Informe um destinatário válido','err');return}
        const sub=ov.querySelector('#mSub').value,body=ov.querySelector('#mBody').value,cc=ov.querySelector('#mCc').value.trim();
        const anexos=[];
        for(const o of os){const r=await gerarPDF(o,false);if(r)anexos.push({o,...r})}
        if(cfg.mailApi){
          try{
            const b64=await Promise.all(anexos.map(a=>new Promise(res=>{const fr=new FileReader();
              fr.onload=()=>res({filename:a.nome,content:String(fr.result).split(',')[1]});fr.readAsDataURL(a.blob)})));
            const rp=await fetch(cfg.mailApi,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({from:cfg.mailRemetente,fromName:cfg.mailNome,to,cc,subject:sub,text:body,attachments:b64})});
            if(!rp.ok)throw new Error('HTTP '+rp.status);
            finalizar('E-mail enviado para '+to);
          }catch(e){toast('Falha no envio ('+e.message+'). Baixando anexos.','err');fallback()}
        }else fallback();
        function fallback(){
          anexos.forEach(a=>dl(a.blob,a.nome));
          const href='mailto:'+encodeURIComponent(to)+'?'+(cc?'cc='+encodeURIComponent(cc)+'&':'')
            +'subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body+'\n\n(anexar os PDFs baixados)');
          const a=document.createElement('a');a.href=href;a.click();
          finalizar('Anexos baixados e mensagem preparada para '+to);
        }
        function finalizar(msg){
          os.forEach(o=>{o.status=o.status==='Aprovado'?o.status:'Enviado';hist(o,'E-mail enviado para '+to)});
          save('orc');close();toast(msg);
          if(ROUTE.k==='orc'){sel.clear();vOrc()}else if(ROUTE.k==='novo'&&B){B.status=orc(B.id)?.status||B.status;vNovo(B.id)}
        }
      };
    }});
}

function pickImage(cb,maxW=420){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/svg+xml,image/webp';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>3.5e6){toast('Imagem acima de 3,5 MB','err');return}
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const r=Math.min(1,maxW/im.naturalWidth);
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.naturalWidth*r);cv.height=Math.round(im.naturalHeight*r);
        const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
        g.drawImage(im,0,0,cv.width,cv.height);
        cb(cv.toDataURL('image/png'));
      };
      im.onerror=()=>cb(String(fr.result));
      im.src=String(fr.result);
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

function importarProdutos(){
  modal({title:'Importar base de produtos',sub:'CSV separado por ; ou , (também aceita TSV)',
    body:`<p style="color:var(--ink-2);line-height:1.7">O arquivo deve ter uma linha de cabeçalho contendo, em qualquer ordem,
      as colunas <b>codigo</b> e <b>descricao</b>. Opcionalmente <b>categoria</b>, <b>aplicacao</b>, <b>valor</b> e <b>ativo</b>.</p>
      <code style="display:block;background:var(--code-bg);padding:11px;border-radius:9px;margin:12px 0;font-size:11.5px;white-space:pre">codigo;descricao;categoria;aplicacao;valor;ativo
1872309;VID PB GM ONIX 20/ 4P/5P VSF (AC/P/SER/SP) AGC;PARABRISA;GM ONIX 20;524,44;SIM</code>
      <label class="chk on" id="lMg"><input type="checkbox" id="iMg" checked>
        <span><b>Atualizar itens existentes</b><small>Códigos já cadastrados são atualizados; os demais são adicionados</small></span></label>
      <div class="logo-box" id="dz" style="height:120px;margin-top:14px"><div class="ph">${ico('up')}
        Clique para escolher o arquivo CSV</div></div>`,
    footer:`<button class="btn" data-close>Fechar</button>`,
    onMount(ov,close){
      ov.querySelector('#dz').onclick=()=>{
        const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.tsv,.txt';
        inp.onchange=()=>{const f=inp.files[0];if(!f)return;
          const fr=new FileReader();
          fr.onload=()=>{
            try{
              const r=parseCSV(String(fr.result),ov.querySelector('#iMg').checked);
              close();toast(`${r.add} adicionados · ${r.upd} atualizados`);vProd();
            }catch(e){toast('Falha ao importar: '+e.message,'err')}
          };
          fr.readAsText(f,'utf-8');
        };inp.click();
      };
    }});
}
function parseCSV(text,merge){
  text=text.replace(/^\uFEFF/,'').replace(/\r/g,'');
  const rows=text.split('\n').filter(l=>l.trim());
  if(rows.length<2)throw new Error('arquivo vazio');
  const sep=[';','\t',','].map(s=>[s,rows[0].split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const cut=l=>{const out=[];let cur='',q=false;
    for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}
    out.push(cur);return out.map(s=>s.trim())};
  const H=cut(rows[0]).map(h=>norm(h).replace(/[^A-Z]/g,''));
  const ix=n=>H.findIndex(h=>h.startsWith(n));
  const iC=ix('COD'),iD=ix('DESC'),iCa=ix('CATEG'),iA=ix('APLIC'),iV=ix('VALOR'),iAt=ix('ATIVO');
  if(iC<0||iD<0)throw new Error('colunas codigo e descricao não encontradas');
  const byCod={};DB.produtos.forEach(p=>byCod[p.codigo]=p);
  let add=0,upd=0;
  for(let i=1;i<rows.length;i++){
    const f=cut(rows[i]);const cod=(f[iC]||'').trim();if(!cod)continue;
    const o={codigo:cod,descricao:(f[iD]||'').trim(),categoria:iCa>=0?(f[iCa]||'').toUpperCase().trim():'',
      aplicacao:iA>=0?(f[iA]||'').trim():'',valor:iV>=0?num(f[iV]):0,
      ativo:iAt>=0?!/^(0|N|NAO|NÃO|FALSE|INATIVO)$/i.test((f[iAt]||'').trim()):true};
    if(!o.aplicacao)o.aplicacao=aplic(o.descricao);
    if(byCod[cod]){if(merge){Object.assign(byCod[cod],o);upd++}}
    else{const p={id:uid(),...o};DB.produtos.push(p);byCod[cod]=p;add++}
  }
  save('prod');return{add,upd};
}
